<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autocentro Mas — Meta Ads Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/fonts/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#f8f9fc;--bg2:#ffffff;--bg3:#f1f3f7;--border:#e2e6ef;--b2:#d0d5e2;
  --tx:#111827;--mu:#4b5563;--di:#9ca3af;
  --brand:#f59e0b;
  --gr:#22c55e;--rd:#ef4444;--am:#f59e0b;--ac:#6366f1;
  --fb:#1877F2;--ig:#e1306c;--an:#f59e0b;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.5;min-height:100vh}
.hdr{position:sticky;top:0;z-index:100;background:rgba(248,249,252,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:36px;height:36px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700}
.hdr-title{font-size:14px;font-weight:600;letter-spacing:-.02em}
.hdr-sub{font-size:11px;color:var(--mu)}
.hdr-right{display:flex;align-items:center;gap:7px}
.badge{display:flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;white-space:nowrap}
.b-live{background:#0a1f10;border:1px solid #1a4020;color:#4ade80}
.b-err{background:#1a0a0a;border:1px solid #4d1010;color:#ef4444}
.ldot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.tbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.5rem 1.5rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pbtn{padding:4px 11px;border-radius:20px;border:1px solid var(--b2);background:transparent;color:var(--mu);font-size:11px;font-family:inherit;cursor:pointer;transition:all .12s;white-space:nowrap}
.pbtn:hover{border-color:var(--brand);color:var(--tx)}
.pbtn.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.pdiv{width:1px;height:18px;background:var(--b2);flex-shrink:0}
.pdsp{font-size:11px;font-family:'DM Mono',monospace;color:var(--mu);margin-left:auto}
.pdsp strong{color:var(--tx)}
.nbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;overflow-x:auto;scrollbar-width:none}
.ntab{padding:.5rem .95rem;font-size:12px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:all .12s;flex-shrink:0}
.ntab:hover{color:var(--tx)}
.ntab.active{color:#fff;border-bottom-color:var(--brand);font-weight:500}
.ntab i{font-size:12px}
.main{padding:1.1rem 1.5rem;max-width:1440px;margin:0 auto}
.ib{border-radius:var(--rs);padding:.55rem .85rem;font-size:11px;line-height:1.6;margin-bottom:.65rem;display:flex;gap:6px;align-items:flex-start}
.ib i{font-size:13px;flex-shrink:0;margin-top:1px}
.ib-ok{background:#0a1a0f;border:1px solid #1a4020;color:#86efac}
.ib-warn{background:#1a130a;border:1px solid #4d3210;color:#fcd34d}
.ib-err{background:#1a0a0a;border:1px solid #4d1010;color:#fca5a5}
.ib-info{background:#0a0f1a;border:1px solid #1a2040;color:#93c5fd}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-bottom:.9rem}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:3px}
.kv{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;line-height:1.1}
.ks{font-size:10px;margin-top:2px;color:var(--mu)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem;margin-bottom:.7rem}
.ct{font-size:10px;font-weight:500;color:var(--mu);display:flex;align-items:center;gap:5px;margin-bottom:.65rem;text-transform:uppercase;letter-spacing:.4px}
.ct i{font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:.7rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:.7rem}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin-bottom:.7rem}
.tw{overflow-x:auto}.tw::-webkit-scrollbar{height:3px}.tw::-webkit-scrollbar-thumb{background:var(--b2)}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:560px}
th{color:var(--mu);font-weight:500;font-size:10px;padding:5px 7px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
td{padding:6px 7px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,0,0,.015)}
.mn{font-family:'DM Mono',monospace;font-weight:500}
.br{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bl{font-size:11px;color:var(--mu);width:90px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb{flex:1;height:18px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;display:flex;align-items:center;padding-right:5px;justify-content:flex-end;min-width:18px}
.bf span{font-size:9px;font-weight:600;color:#fff}
.bv{font-size:10px;font-weight:500;width:130px;flex-shrink:0;font-family:'DM Mono',monospace}
.pill{font-size:9px;padding:2px 6px;border-radius:5px;font-weight:600;display:inline-block;vertical-align:middle}
.p-ok{background:#0a1f10;color:#4ade80;border:1px solid #1a4020}
.p-warn{background:#1a130a;color:#f59e0b;border:1px solid #4d3210}
.p-bad{background:#1a0a0a;color:#ef4444;border:1px solid #4d1010}
.p-info{background:#0a0f1a;color:#818cf8;border:1px solid #1a2040}
.p-paid{background:var(--brand);color:#fff;border:none;font-size:8px;padding:2px 5px;border-radius:4px;font-weight:700}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:9px;margin-bottom:.9rem}
.ac{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.75rem;position:relative}
.ac.win{border-color:var(--gr)}.ac:hover{border-color:var(--b2)}
.ark{position:absolute;top:7px;left:7px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}
.ark.r1{background:var(--am);color:#000}.ark.rn{background:var(--brand);color:#fff}
.ath{width:100%;aspect-ratio:1.6;background:var(--bg2);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:22px;color:var(--di)}
.adl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--brand);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.anm{font-size:11px;font-weight:500;color:var(--tx);margin-bottom:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ast{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-bottom:2px}
.ast strong{color:var(--tx);font-family:'DM Mono',monospace;font-weight:500}
.ant{font-size:9px;color:var(--di);line-height:1.4;margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}
.stabs{display:flex;gap:5px;margin-bottom:.85rem;flex-wrap:wrap}
.stab{padding:5px 12px;border-radius:20px;border:1px solid var(--b2);background:transparent;color:var(--mu);font-size:11px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .12s}
.stab:hover{border-color:var(--brand);color:var(--tx)}
.stab.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
/* FUNNEL */
.funnel-stage{margin-bottom:.65rem}
.fhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:11px}
.fbar-track{height:22px;background:var(--bg3);border-radius:4px;overflow:hidden;position:relative}
.fbar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;justify-content:flex-end;transition:width .4s ease}
.fbar-fill span{font-size:10px;font-weight:600;color:#fff}
.fbar-bench{position:absolute;top:0;height:100%;border-right:2px dashed rgba(255,255,255,.4);display:flex;align-items:center;padding-right:4px}
.fbar-bench span{font-size:9px;color:rgba(255,255,255,.6);white-space:nowrap}
/* BB SCORE */
.bb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-bottom:.9rem}
.bb-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.8rem}
.bb-metric{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.bb-score-bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:6px 0}
.bb-score-fill{height:100%;border-radius:4px}
.bb-vals{display:flex;justify-content:space-between;font-size:10px;font-family:'DM Mono',monospace}
.bb-rec{background:var(--bg2);border-left:3px solid var(--brand);border-radius:0 var(--rs) var(--rs) 0;padding:.6rem .8rem;margin-bottom:.5rem}
.bb-rec-title{font-size:12px;font-weight:500;margin-bottom:2px}
.bb-rec-body{font-size:11px;color:var(--mu);line-height:1.5}
.bb-rec-action{font-size:10px;color:var(--brand);font-weight:500;margin-top:3px}
.bb-rec.urgent{border-left-color:var(--rd)}.bb-rec.warn{border-left-color:var(--am)}.bb-rec.good{border-left-color:var(--gr)}
/* OVERALL SCORE */
.score-circle{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--brand);flex-shrink:0}
.score-num{font-size:32px;font-weight:700;font-family:'DM Mono',monospace;line-height:1}
.score-lbl{font-size:10px;color:var(--mu);margin-top:2px}
.sk{background:linear-gradient(90deg,var(--bg3) 25%,var(--b2) 50%,var(--bg3) 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:4px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.footer{border-top:1px solid var(--border);padding:.65rem 1.5rem;text-align:center;font-size:10px;color:var(--di);margin-top:2rem}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.hdr,.tbar,.nbar,.main{padding-left:.75rem;padding-right:.75rem}.g2,.g3,.g4{grid-template-columns:1fr}.kgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.pdsp{display:none}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">M</div>
    <div>
      <div class="hdr-title">Autocentro Mas — Meta Ads Dashboard</div>
      <div class="hdr-sub">act_850818032362895 · auto-update 24h · Meta Marketing API v21</div>
    </div>
  </div>
  <div class="hdr-right">
    <span id="fetchedAt" style="font-size:10px;color:var(--di)"></span>
    <div class="badge b-live" id="statusBadge"><span class="ldot"></span>Live</div>
  </div>
</header>
<div class="tbar">
  <button class="pbtn active" data-r="last_30d">30d</button>
  <button class="pbtn" data-r="last_14d">14d</button>
  <button class="pbtn" data-r="last_7d">7d</button>
  <button class="pbtn" data-r="last_90d">90d</button>
  <div class="pdiv"></div>
  <span class="pdsp" id="pdsp"></span>
</div>
<div class="nbar">
  <div class="ntab active" data-t="overview"><i class="ti ti-dashboard"></i>Overview</div>
  <div class="ntab" data-t="platforms"><i class="ti ti-brand-facebook"></i>Plataformas</div>
  <div class="ntab" data-t="paid"><i class="ti ti-ad"></i>Paid Ads</div>
  <div class="ntab" data-t="funnel"><i class="ti ti-funnel"></i>Funnel</div>
  <div class="ntab" data-t="bb"><i class="ti ti-award"></i>Brilliant Basics</div>
</div>
<div class="main" id="mc">
  <div style="text-align:center;padding:3rem;color:var(--mu)">
    <div style="width:22px;height:22px;border:3px solid var(--b2);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem"></div>
    Cargando datos...
  </div>
</div>
<footer class="footer">Autocentro Mas · Meta Ads Dashboard · GitHub Actions auto-update · <span id="lu"></span></footer>

<script>
(function(){
'use strict';
var DATA_URL  = 'data/mas_data.json';
var BRAND     = '#f59e0b';
var DEALER_NM = 'Autocentro Mas';
var PC={facebook:'#1877F2',instagram:'#e1306c',audience_network:'#f59e0b'};
var PL={facebook:'Facebook',instagram:'Instagram',audience_network:'Aud. Network'};

// Benchmarks
var BM = {
  // Client benchmarks
  client: { tof:25, mof:35, bof:40 },
  // Meta automotive T3 benchmarks
  meta:   { tof:15, mof:25, bof:60 },
  // Performance benchmarks
  cpl_good:15, cpl_warn:35, cpl_bad:60,
  ctr_good:1.5, ctr_warn:1.0,
  freq_good:4, freq_warn:6, freq_bad:10,
  cpm_good:8, cpm_warn:15,
  thruplay_rate_good:20, thruplay_rate_warn:12,
  cpc_good:0.5, cpc_warn:1.5
};

var state={raw:null,range:'last_30d',tab:'overview',ptab:'leads'};
var charts={};

function fN(n){return Math.round(parseFloat(n)||0).toLocaleString('en-US');}
function fD(n){return '$'+parseFloat(n||0).toFixed(2);}
function fDK(n){return '$'+Math.round(parseFloat(n)||0).toLocaleString('en-US');}
function fPct(n){return parseFloat(n||0).toFixed(1)+'%';}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function cplC(c){return c>0&&c<BM.cpl_good?'var(--gr)':c<BM.cpl_warn?'var(--am)':'var(--rd)';}
function freqC(f){return f<BM.freq_good?'var(--gr)':f<BM.freq_warn?'var(--am)':'var(--rd)';}
function ctrC(c){return c>=BM.ctr_good?'var(--gr)':c>=BM.ctr_warn?'var(--am)':'var(--rd)';}
function g(id){return document.getElementById(id);}
function dC(){Object.keys(charts).forEach(function(k){try{charts[k].destroy();}catch(e){}});charts={};}
function getRng(){return(state.raw&&state.raw.ranges&&state.raw.ranges[state.range])||null;}

// Classify ad into funnel stage based on name
function classifyAd(name){
  var n=(name||'').toUpperCase();
  if(/[-_\s]?TOF[^A-Z]?|TOFU|TOP.OF.FUNNEL|AWARENESS/i.test(n)) return 'tof';
  if(/[-_\s]?MOF[^A-Z]?|MOFU|MID.OF.FUNNEL|CONSIDERATION/i.test(n)) return 'mof';
  if(/[-_\s]?BOF[^A-Z]?|BOFU|BOTTOM.OF.FUNNEL|CONVERSION|LEAD.*FORM|FORM.*LEAD/i.test(n)) return 'bof';
  return 'unknown';
}

function loadData(){
  fetch(DATA_URL+'?t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      state.raw=d;
      var meta=d.meta||{};
      g('lu').textContent=meta.fetched_at||'';
      g('fetchedAt').textContent='Datos: '+meta.fetched_at;
      g('statusBadge').className='badge b-live';
      g('statusBadge').innerHTML='<span class="ldot"></span>Live';
      render();
    })
    .catch(function(e){
      g('statusBadge').className='badge b-err';
      g('statusBadge').innerHTML='<i class="ti ti-alert-circle" style="font-size:11px"></i> Error';
      g('mc').innerHTML='<div class="ib ib-err"><i class="ti ti-alert-circle"></i><div>No se pudo cargar <strong>'+DATA_URL+'</strong>.<br>Corre el GitHub Action primero.</div></div>';
    });
}

function render(){
  var rng=getRng();
  if(!rng){g('mc').innerHTML='<div class="ib ib-warn"><i class="ti ti-alert-triangle"></i><span>Sin datos para este período.</span></div>';return;}
  g('pdsp').innerHTML='<strong>'+rng.since+' — '+rng.until+'</strong>';
  dC();
  var tabs={overview:renderOverview,platforms:renderPlatforms,paid:renderPaid,funnel:renderFunnel,bb:renderBB};
  g('mc').innerHTML=(tabs[state.tab]||renderOverview)();
  setTimeout(initCharts,80);
}

function kpi(label,val,sub,color,border){
  return '<div class="kpi"'+(border?' style="border-left:3px solid '+border+'"':'')+'>'+
    '<div class="kl">'+label+'</div>'+
    '<div class="kv" style="color:'+(color||'var(--tx)')+'">'+val+'</div>'+
    (sub?'<div class="ks">'+sub+'</div>':'')+
  '</div>';
}
function ast(l,v){return '<div class="ast"><span>'+l+'</span><strong>'+v+'</strong></div>';}

// ── OVERVIEW ──────────────────────────────────────────────────────────────────
function renderOverview(){
  var rng=getRng(),s=rng.summary||{};
  var cpl=s.leads>0?s.spend/s.leads:0;
  var fr=s.freq||0;
  var tpRate=s.thruplay>0&&s.views25>0?Math.round(s.thruplay/s.views25*100):0;
  var h='';

  // Smart alert
  if(fr>BM.freq_bad) h+='<div class="ib ib-err"><i class="ti ti-alert-circle"></i><span><strong>Frecuencia crítica '+fr.toFixed(2)+'x</strong> — Audiencia saturada. Acción inmediata requerida: ampliar targeting y rotar creativos.</span></div>';
  else if(fr>BM.freq_warn) h+='<div class="ib ib-warn"><i class="ti ti-alert-triangle"></i><span><strong>Frecuencia alta '+fr.toFixed(2)+'x</strong> — Considera ampliar audiencias. Benchmark recomendado: &lt;'+BM.freq_good+'x para lead gen.</span></div>';
  else h+='<div class="ib ib-ok"><i class="ti ti-check"></i><span>Performance dentro de rangos saludables · '+rng.since+' — '+rng.until+'</span></div>';

  // KPIs
  h+='<div class="kgrid">';
  h+=kpi('Gasto total',fDK(s.spend),'período seleccionado');
  h+=kpi('Impresiones',fN(s.imp),'');
  h+=kpi('Alcance único',fN(s.reach),'');
  h+=kpi('Frecuencia',fr.toFixed(2)+'x',fr>BM.freq_warn?'⚠ Alta':fr>BM.freq_good?'Monitorear':'✓ OK',freqC(fr));
  h+=kpi('Clics totales',fN(s.clicks),'');
  h+=kpi('CTR',(s.ctr||0).toFixed(2)+'%','benchmark >'+BM.ctr_good+'%',ctrC(s.ctr||0));
  h+=kpi('CPC',fD(s.cpc),'costo por clic');
  h+=kpi('CPM',fD(s.cpm),'por 1,000 imp');
  h+=kpi('Leads',fN(s.leads),'','var(--gr)');
  h+=kpi('CPL',cpl>0?fD(cpl):'—','benchmark $'+BM.cpl_good+'-$'+BM.cpl_warn,cpl>0?cplC(cpl):'var(--mu)');
  h+=kpi('ThruPlays',fN(s.thruplay),'video completo');
  h+=kpi('Views 25%',fN(s.views25),'primer cuarto');
  if(tpRate>0) h+=kpi('Completion rate',tpRate+'%','thruplay/views25',tpRate>=BM.thruplay_rate_good?'var(--gr)':tpRate>=BM.thruplay_rate_warn?'var(--am)':'var(--rd)');
  h+='</div>';

  // Charts row 1
  h+='<div class="g2">';
  h+='<div class="card"><div class="ct"><i class="ti ti-wallet"></i>Gasto · Leads · ThruPlays (indexados)</div><div style="position:relative;height:210px"><canvas id="chMain"></canvas></div></div>';
  h+='<div class="card"><div class="ct"><i class="ti ti-brand-facebook"></i>Distribución de gasto por plataforma</div><div style="position:relative;height:210px"><canvas id="chPlat"></canvas></div></div>';
  h+='</div>';

  // Platform bars
  var p=rng.platforms||{};
  var pk=Object.keys(p).filter(function(k){return p[k].spend>0.5;}).sort(function(a,b){return p[b].spend-p[a].spend;});
  var totS=pk.reduce(function(s,k){return s+p[k].spend;},0);
  if(pk.length){
    h+='<div class="card"><div class="ct"><i class="ti ti-layout-distribute-horizontal"></i>Inversión y leads por plataforma</div>';
    pk.forEach(function(k){
      var pv=p[k],c=pv.leads>0?pv.spend/pv.leads:0;
      h+='<div class="br"><div class="bl">'+(PL[k]||k)+'</div>';
      h+='<div class="bb"><div class="bf" style="width:'+pct(pv.spend,totS)+'%;background:'+(PC[k]||'#4b5563')+'"><span>'+pct(pv.spend,totS)+'%</span></div></div>';
      h+='<div class="bv">'+fDK(pv.spend)+' · <span style="color:'+(pv.leads>0?'var(--gr)':'var(--di)')+'">'+pv.leads+' leads</span>'+(c>0?' · CPL '+fD(c):'')+'</div></div>';

  var h='<div class="g3">';

  });
  h+='</div>';

  h+='<div class="g2">';
  h+='<div class="card"><div class="ct"><i class="ti ti-chart-donut"></i>Distribución de gasto</div><div style="position:relative;height:220px"><canvas id="chPD"></canvas></div></div>';
  h+='<div class="card"><div class="ct"><i class="ti ti-chart-donut-2"></i>Distribución de leads</div><div style="position:relative;height:220px"><canvas id="chPDL"></canvas></div></div>';

  h+='<div class="g2">';
  h+='<div class="card"><div class="ct"><i class="ti ti-receipt"></i>CPL por plataforma</div><div style="position:relative;height:200px"><canvas id="chCPL"></canvas></div></div>';
  h+='<div class="card"><div class="ct"><i class="ti ti-trending-up"></i>CTR por plataforma</div><div style="position:relative;height:200px"><canvas id="chCTR"></canvas></div></div>';
  h+='</div>';

  h+='<div class="card"><div class="ct"><i class="ti ti-table"></i>Detalle completo · '+rng.since+' — '+rng.until+'</div><div class="tw"><table>';
  h+='<thead><tr><th>Plataforma</th><th>Gasto</th><th>% Gasto</th><th>Imp.</th><th>Alcance</th><th>Clics</th><th>CTR</th><th>CPC</th><th>Leads</th><th>% Leads</th><th>CPL</th><th>Eficiencia</th></tr></thead><tbody>';
  pk.forEach(function(k){
    var pv=p[k],c=pv.leads>0?pv.spend/pv.leads:0;
    var eff=c>0&&pv.ctr>0?Math.round(((pv.ctr/BM.ctr_good)*50)+((Math.max(0,BM.cpl_warn-c)/BM.cpl_warn)*50)):0;
    h+='<tr>';
    h+='<td><span style="width:8px;height:8px;border-radius:2px;background:'+(PC[k]||'#4b5563')+';display:inline-block;vertical-align:middle;margin-right:5px"></span>'+(PL[k]||k)+'</td>';
    h+='<td class="mn">'+fD(pv.spend)+'</td>';
    h+='<td><span class="pill p-info">'+pct(pv.spend,totS)+'%</span></td>';
    h+='<td>'+fN(pv.imp||0)+'</td>';
    h+='<td>'+fN(pv.reach||0)+'</td>';
    h+='<td>'+fN(pv.clicks)+'</td>';
    h+='<td style="color:'+ctrC(pv.ctr||0)+'">'+(pv.ctr||0).toFixed(2)+'%</td>';
    h+='<td>'+fD(pv.cpc||0)+'</td>';
    h+='<td style="color:'+(pv.leads>0?'var(--gr)':'var(--di)');h+='font-weight:500">'+pv.leads+'</td>';
    h+='<td><span class="pill '+(pv.leads>=totL*0.4?'p-ok':'p-info')+'">'+pct(pv.leads,totL)+'%</span></td>';
    h+='<td style="color:'+cplC(c)+';font-weight:500">'+(c>0?fD(c):'—')+'</td>';
    h+='<td><div style="display:flex;align-items:center;gap:5px"><div style="width:60px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="width:'+Math.min(eff,100)+'%;height:100%;background:'+(eff>65?'var(--gr)':eff>40?'var(--am)':'var(--rd)')+';border-radius:3px"></div></div><span style="font-size:10px;color:var(--mu)">'+eff+'</span></div></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';

  // AN warning
  var an=p['audience_network']||{};
  if(an.spend>500&&(an.leads||0)<5){
    h+='<div class="ib ib-warn"><i class="ti ti-alert-triangle"></i><span>';
    h+='<strong>Audience Network: '+fDK(an.spend)+' invertidos con solo '+(an.leads||0)+' leads.</strong> ';
    h+=pct(an.spend,totS)+'% del presupuesto con ROI mínimo. Recomendación: Redirigir a Instagram Reels o Facebook Feed.';

    h+='</span></div>';

  return h;
}

function renderPaid(){

function renderPaidContent(){
  var rng=getRng(),ads=rng.ads||[];
  if(!ads.length) return '<div class="ib ib-warn"><i class="ti ti-alert-triangle"></i><span>Sin anuncios en este período. Ajusta el rango de fechas.</span></div>';

  if(state.ptab==='table') return renderAdsTable(ads);

  if(state.ptab==='leads'){
    var sorted=ads.slice().sort(function(a,b){return b.leads-a.leads;});
    var top=sorted.filter(function(a){return a.leads>0;}).slice(0,5);
    if(!top.length) top=sorted.slice(0,5);
    return renderAdCards(top,'leads',rng)
      +'<div class="card"><div class="ct"><i class="ti ti-chart-bar"></i>Top 5 Paid — Leads vs CPL</div><div style="position:relative;height:210px"><canvas id="chPaid"></canvas></div></div>';
  } else {
    var sorted2=ads.slice().sort(function(a,b){return b.thruplay-a.thruplay;});
    var top2=sorted2.filter(function(a){return a.thruplay>0;}).slice(0,5);
    if(!top2.length) top2=sorted2.slice(0,5);
    return renderAdCards(top2,'views',rng)
      +'<div class="card"><div class="ct"><i class="ti ti-chart-bar"></i>Top 5 Paid — ThruPlays vs Views 25%</div><div style="position:relative;height:210px"><canvas id="chPaid"></canvas></div></div>';
  }
}

// ── FUNNEL ────────────────────────────────────────────────────────────────────
function renderFunnel(){
  var rng=getRng(),ads=rng.ads||[];
  var buckets={tof:{spend:0,leads:0,imp:0,count:0},mof:{spend:0,leads:0,imp:0,count:0},bof:{spend:0,leads:0,imp:0,count:0},unknown:{spend:0,leads:0,imp:0,count:0}};
  ads.forEach(function(a){
    var s=classifyAd(a.name);
    buckets[s].spend+=a.spend;buckets[s].leads+=a.leads;buckets[s].imp+=a.imp;buckets[s].count++;
  });
  var totSpend=buckets.tof.spend+buckets.mof.spend+buckets.bof.spend+buckets.unknown.spend;
  var classified=totSpend-buckets.unknown.spend;
  var classifiedPct=pct(classified,totSpend);

  var tofPct=pct(buckets.tof.spend,totSpend);
  var mofPct=pct(buckets.mof.spend,totSpend);
  var bofPct=pct(buckets.bof.spend,totSpend);
  var unkPct=pct(buckets.unknown.spend,totSpend);

  var h='<div class="ib ib-info"><i class="ti ti-info-circle"></i><span>';
  h+='<strong>TOF</strong> = Awareness · <strong>MOF</strong> = Consideration · <strong>BOF</strong> = Conversion · ';
  h+='Clasificado: <strong>'+classifiedPct+'%</strong> del gasto · ';
  h+='Nomenclatura activa desde Feb 2026.';
  h+='</span></div>';

  if(unkPct>30){
    h+='<div class="ib ib-warn"><i class="ti ti-alert-triangle"></i><span>';
    h+='<strong>'+unkPct+'% del gasto sin clasificar</strong> — Estos anuncios no tienen TOF/MOF/BOF en el nombre. ';
    h+='Incluyen campañas previas a Feb 2026 o con nomenclatura diferente.';
    h+='</span></div>';
  }

  h+='<div class="card"><div class="ct"><i class="ti ti-funnel"></i>Distribución actual de inversión</div>';

  // TOF bar
  h+='<div class="funnel-stage">';
  h+='<div class="fhd"><span style="font-weight:500">Awareness <span class="pill p-info">TOF</span></span><span style="font-family:\'DM Mono\',monospace">'+fDK(buckets.tof.spend)+' · '+tofPct+'%</span></div>';
  h+='<div class="fbar-track">';
  h+='<div class="fbar-fill" style="width:'+tofPct+'%;background:#60a5fa"><span>'+tofPct+'%</span></div>';
  h+='<div class="fbar-bench" style="left:'+BM.client.tof+'%"><span>Tu: '+BM.client.tof+'%</span></div>';
  h+='</div></div>';

  // MOF bar
  h+='<div class="funnel-stage">';
  h+='<div class="fhd"><span style="font-weight:500">Consideration <span class="pill p-warn">MOF</span></span><span style="font-family:\'DM Mono\',monospace">'+fDK(buckets.mof.spend)+' · '+mofPct+'%</span></div>';
  h+='<div class="fbar-track">';
  h+='<div class="fbar-fill" style="width:'+mofPct+'%;background:'+BRAND+'"><span>'+mofPct+'%</span></div>';
  h+='<div class="fbar-bench" style="left:'+BM.client.mof+'%"><span>Tu: '+BM.client.mof+'%</span></div>';
  h+='</div></div>';

  // BOF bar
  h+='<div class="funnel-stage">';
  h+='<div class="fhd"><span style="font-weight:500">Conversion <span class="pill p-ok">BOF</span></span><span style="font-family:\'DM Mono\',monospace">'+fDK(buckets.bof.spend)+' · '+bofPct+'%</span></div>';
  h+='<div class="fbar-track">';
  h+='<div class="fbar-fill" style="width:'+bofPct+'%;background:var(--gr)"><span>'+bofPct+'%</span></div>';
  h+='<div class="fbar-bench" style="left:'+BM.client.bof+'%"><span>Tu: '+BM.client.bof+'%</span></div>';
  h+='</div></div>';

  if(unkPct>0){
    h+='<div class="funnel-stage">';
    h+='<div class="fhd"><span style="color:var(--mu)">Sin clasificar</span><span style="font-family:\'DM Mono\',monospace;color:var(--mu)">'+fDK(buckets.unknown.spend)+' · '+unkPct+'%</span></div>';
    h+='<div class="fbar-track"><div class="fbar-fill" style="width:'+unkPct+'%;background:var(--di)"><span>'+unkPct+'%</span></div></div>';
    h+='</div>';
  }
  h+='</div>';

  // Benchmark comparison table
  h+='<div class="card"><div class="ct"><i class="ti ti-chart-bar"></i>Actual vs Benchmarks</div>';
  h+='<div style="position:relative;height:240px"><canvas id="chFunnel"></canvas></div>';
  h+='<div style="display:flex;gap:15px;margin-top:.65rem;font-size:10px;flex-wrap:wrap">';
  h+='<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#60a5fa;display:inline-block"></span>Actual</span>';
  h+='<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:'+BRAND+';display:inline-block"></span>Tu benchmark</span>';

  [{key:'tof',label:'Awareness (TOF)',color:'#60a5fa',bench:BM.client.tof,metaBench:BM.meta.tof},

   {key:'bof',label:'Conversion (BOF)',color:'var(--gr)',bench:BM.client.bof,metaBench:BM.meta.bof}

    h+='<div class="ks">vs Meta T3: <span style="color:'+(Math.abs(metaDiff)<8?'var(--gr)':'var(--am)')+'">'+(metaDiff>=0?'+':'')+metaDiff+'%</span></div>';

  });

  var insights=buildFunnelInsights(tofPct,mofPct,bofPct,buckets,totSpend);
  insights.forEach(function(ins){
    h+='<div class="bb-rec '+ins.type+'"><div class="bb-rec-title">'+ins.title+'</div><div class="bb-rec-body">'+ins.body+'</div><div class="bb-rec-action">→ '+ins.action+'</div></div>';
  });
  h+='</div>';

  return h;
}

function buildFunnelInsights(tof,mof,bof,buckets,total){
  var ins=[];
  if(bof<BM.client.bof-10) ins.push({type:'warn',title:'BOF sub-invertido ('+bof+'% vs objetivo '+BM.client.bof+'%)',body:'Menos presupuesto del objetivo en conversión. Los leads pueden estar siendo limitados por falta de inversión en el fondo del funnel.',action:'Mover presupuesto de TOF/MOF hacia campañas BOF de lead gen'});
  else if(bof>BM.client.bof+10) ins.push({type:'good',title:'BOF bien invertido ('+bof+'%)',body:'Distribución orientada a conversión. Monitorea que el CPL se mantenga eficiente a esta escala.',action:'Mantener distribución, optimizar creativos de conversión'});
  if(tof>BM.client.tof+10) ins.push({type:'warn',title:'TOF sobre-invertido ('+tof+'% vs objetivo '+BM.client.tof+'%)',body:'Demasiado presupuesto en awareness puede estar diluyendo el ROI. El TOF es necesario pero no debe dominar.',action:'Reducir TOF en '+Math.round(tof-BM.client.tof)+'% y redirigir a BOF'});
  var fbCPL=0,igCPL=0;
  if(ins.length===0) ins.push({type:'good',title:'Distribución dentro del objetivo',body:'La inversión por funnel está alineada con tu benchmark. Enfócate en optimizar creativos y frecuencia.',action:'Revisar CTR y CPL por ad set semanalmente'});
  return ins.slice(0,4);
}

// ── BRILLIANT BASICS ──────────────────────────────────────────────────────────
function renderBB(){
  var rng=getRng(),s=rng.summary||{},p=rng.platforms||{},ads=rng.ads||[];
  if(!s.spend) return '<div class="ib ib-warn"><i class="ti ti-alert-triangle"></i><span>Sin datos suficientes para calcular Brilliant Basics.</span></div>';

  var cpl=s.leads>0?s.spend/s.leads:0;
  var fr=s.freq||0;
  var tpRate=s.thruplay>0&&s.views25>0?Math.round(s.thruplay/s.views25*100):0;

  // Calculate scores (0-100 each)
  var scores={
    cpl:    cpl>0?Math.max(0,Math.min(100,Math.round((1-Math.max(0,cpl-BM.cpl_good)/(BM.cpl_bad-BM.cpl_good))*100))):50,
    ctr:    Math.max(0,Math.min(100,Math.round((s.ctr||0)/BM.ctr_good*100))),
    freq:   Math.max(0,Math.min(100,Math.round((1-Math.max(0,fr-BM.freq_good)/(BM.freq_bad-BM.freq_good))*100))),
    cpm:    Math.max(0,Math.min(100,Math.round((1-Math.max(0,(s.cpm||0)-BM.cpm_good)/(BM.cpm_warn*2-BM.cpm_good))*100))),
    thru:   tpRate>0?Math.max(0,Math.min(100,Math.round(tpRate/BM.thruplay_rate_good*100))):null,
    reach:  s.reach>0&&s.imp>0?Math.max(0,Math.min(100,100-Math.round(fr/BM.freq_bad*100))):50,
  };
  var validScores=Object.values(scores).filter(function(v){return v!==null;});
  var overallScore=Math.round(validScores.reduce(function(a,b){return a+b;},0)/validScores.length);

  // Overall score color
  var scoreColor=overallScore>=70?'var(--gr)':overallScore>=50?'var(--am)':'var(--rd)';
  var scoreLbl=overallScore>=70?'Bueno':overallScore>=50?'Regular':'Necesita atención';

  var h='<div style="display:flex;align-items:center;gap:1.2rem;margin-bottom:1rem;flex-wrap:wrap">';
  h+='<div class="score-circle" style="border-color:'+scoreColor+'">';
  h+='<div class="score-num" style="color:'+scoreColor+'">'+overallScore+'</div>';
  h+='<div class="score-lbl">/ 100</div></div>';
  h+='<div><div style="font-size:16px;font-weight:600;color:'+scoreColor+'">'+scoreLbl+'</div>';
  h+='<div style="font-size:12px;color:var(--mu);margin-top:3px">Score Brilliant Basics · '+rng.since+' — '+rng.until+'</div>';
  h+='<div style="font-size:11px;color:var(--mu);margin-top:2px">Basado en CPL, CTR, Frecuencia, CPM, ThruPlay Rate, Alcance</div>';
  h+='</div></div>';

  // Score cards
  h+='<div class="bb-grid">';
  var metrics=[
    {key:'cpl',    label:'CPL',          val:cpl>0?fD(cpl):'N/A',   bench:'$'+BM.cpl_good+'-$'+BM.cpl_warn, score:scores.cpl,   note:cpl>BM.cpl_warn?'CPL sobre benchmark — revisar audiencias y creativos':'CPL dentro del rango objetivo'},
    {key:'ctr',    label:'CTR',          val:(s.ctr||0).toFixed(2)+'%', bench:'>'+BM.ctr_good+'%',        score:scores.ctr,   note:(s.ctr||0)<BM.ctr_warn?'CTR bajo — revisar creativos y copy del anuncio':'CTR saludable'},
    {key:'freq',   label:'Frecuencia',   val:fr.toFixed(2)+'x',     bench:'<'+BM.freq_good+'x',           score:scores.freq,  note:fr>BM.freq_warn?'Frecuencia alta — ampliar audiencias urgente':fr>BM.freq_good?'Frecuencia elevada — monitorear':'Frecuencia óptima'},
    {key:'cpm',    label:'CPM',          val:fD(s.cpm||0),          bench:'$'+BM.cpm_good+'-$'+BM.cpm_warn, score:scores.cpm, note:(s.cpm||0)>BM.cpm_warn?'CPM alto — considerar optimizar placements':'CPM competitivo'},
    scores.thru!==null?{key:'thru',label:'Completion Rate',val:tpRate+'%',bench:'>'+BM.thruplay_rate_good+'%',score:scores.thru,note:tpRate<BM.thruplay_rate_warn?'Videos muy cortos o no retienen — revisar creativos de video':'Retención de video saludable'}:null,
    {key:'reach',  label:'Alcance único',val:fN(s.reach),          bench:'Frec <'+BM.freq_good+'x',       score:scores.reach, note:fr>BM.freq_good?'Ampliar audiencias para aumentar alcance único':'Alcance diversificado'},
  ].filter(Boolean);

  metrics.forEach(function(m){
    var sc=m.score||0;
    var col=sc>=70?'var(--gr)':sc>=50?'var(--am)':'var(--rd)';
    h+='<div class="bb-card">';
    h+='<div class="bb-metric">'+m.label+'</div>';
    h+='<div style="font-size:18px;font-weight:600;font-family:\'DM Mono\',monospace;color:'+col+'">'+m.val+'</div>';
    h+='<div class="bb-score-bar"><div class="bb-score-fill" style="width:'+sc+'%;background:'+col+'"></div></div>';
    h+='<div class="bb-vals"><span style="color:var(--mu)">Benchmark: '+m.bench+'</span><span style="color:'+col+'">'+sc+'/100</span></div>';
    h+='<div style="font-size:10px;color:var(--mu);margin-top:4px">'+m.note+'</div>';
    h+='</div>';
  });
  h+='</div>';

  // Recommendations
  h+='<div class="card"><div class="ct"><i class="ti ti-bulb"></i>Recomendaciones accionables para el equipo</div>';
  var recs=buildRecommendations(s,p,ads,scores,cpl,fr,tpRate);
  recs.forEach(function(r){
    h+='<div class="bb-rec '+r.type+'">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">';
    h+='<div class="bb-rec-title"><i class="ti '+r.icon+'" style="margin-right:5px;font-size:12px"></i>'+r.title+'</div>';
    h+='<span class="pill '+(r.type==='urgent'?'p-bad':r.type==='warn'?'p-warn':'p-ok')+'">'+(r.type==='urgent'?'Urgente':r.type==='warn'?'Atención':'Oportunidad')+'</span>';
    h+='</div>';
    h+='<div class="bb-rec-body">'+r.body+'</div>';
    h+='<div class="bb-rec-action">→ '+r.action+'</div>';
    h+='</div>';
  });
  h+='</div>';

  // BB Chart
  h+='<div class="card"><div class="ct"><i class="ti ti-radar"></i>Score por dimensión</div><div style="position:relative;height:250px"><canvas id="chBB"></canvas></div></div>';

  return h;
}

function buildRecommendations(s,p,ads,scores,cpl,fr,tpRate){
  var recs=[];
  var fb=p.facebook||{},ig=p.instagram||{},an=p.audience_network||{};

  // 1. Frequency
  if(fr>BM.freq_bad) recs.push({type:'urgent',icon:'ti-alert-circle',title:'Frecuencia crítica ('+fr.toFixed(1)+'x) — Acción inmediata',body:'La audiencia está completamente saturada. Cada persona ha visto los anuncios '+fr.toFixed(0)+' veces. Esto infla el CPM y destruye el CTR.',action:'Pausar ad sets con frecuencia >10x. Crear nuevas audiencias Lookalike 2-5%. Rotar mínimo 3 creativos nuevos esta semana.'});
  else if(fr>BM.freq_warn) recs.push({type:'warn',icon:'ti-refresh',title:'Frecuencia elevada ('+fr.toFixed(1)+'x) — Rotar creativos',body:'La frecuencia supera el benchmark de '+BM.freq_good+'x para lead gen. El rendimiento decaerá en las próximas 2-3 semanas si no se actúa.',action:'Ampliar audiencias existentes en 20-30%. Introducir 2 nuevos creativos. Revisar frequency caps en ad sets.'});

  // 2. Audience Network
  if(an.spend>300&&(an.leads||0)<3) recs.push({type:'urgent',icon:'ti-ban',title:'Audience Network: '+fDK(an.spend)+' sin conversiones',body:'Audience Network está consumiendo presupuesto con CTR bajo y prácticamente cero leads. Este placement no funciona para automotive lead gen.',action:'Desactivar Audience Network en todos los ad sets. Redirigir ese presupuesto a Instagram Reels (mejor CPL en automotive).'});

  // 3. IG vs FB efficiency
  var fbCPL=fb.leads>0?fb.spend/fb.leads:0,igCPL=ig.leads>0?ig.spend/ig.leads:0;
  if(fbCPL>0&&igCPL>0&&igCPL<fbCPL*0.75) recs.push({type:'good',icon:'ti-brand-instagram',title:'Instagram '+Math.round((1-igCPL/fbCPL)*100)+'% más eficiente que Facebook',body:'CPL Instagram: '+fD(igCPL)+' vs Facebook: '+fD(fbCPL)+'. Instagram solo recibe el '+pct(ig.spend,(fb.spend||0)+(ig.spend||0)+(an.spend||0))+'% del presupuesto.',action:'Incrementar presupuesto de Instagram en 25-30%. Crear versiones verticales 9:16 de los mejores creativos para Reels.'});

  // 4. CTR
  if((s.ctr||0)<BM.ctr_warn) recs.push({type:'warn',icon:'ti-photo',title:'CTR bajo ('+((s.ctr||0).toFixed(2))+'%) — Revisar creativos',body:'CTR bajo indica que los anuncios no están generando interés suficiente. En automotive, CTR <1% generalmente señala fatiga creativa o mensaje desalineado.',action:'A/B test: probar headlines con precio específico vs modelo vs oferta. Videos de 6-10 segundos con el precio visible en los primeros 3 segundos tienen 40% más CTR en automotive.'});

  // 5. ThruPlay rate
  if(tpRate>0&&tpRate<BM.thruplay_rate_warn) recs.push({type:'warn',icon:'ti-player-play',title:'Completion rate de video bajo ('+tpRate+'%)',body:'Solo '+tpRate+'% de quienes ven los primeros 25% del video lo completan. Los videos de automotive deben capturar atención en los primeros 3 segundos con el modelo y precio visibles.',action:'Acortar videos a 15-20 segundos máximo. Mostrar el vehículo y precio en el frame 0-3s. Testear formato "cinematic" vs "ugc style".'});

  // 6. CPL
  if(cpl>BM.cpl_warn) recs.push({type:'warn',icon:'ti-receipt',title:'CPL sobre benchmark ('+fD(cpl)+' vs objetivo $'+BM.cpl_warn+')',body:'El costo por lead supera el benchmark de automotive T3 en PR. Las principales causas son: frecuencia alta, creativos fatigados, o audiencias muy pequeñas.',action:'1. Revisar y pausar ad sets con CPL >$'+BM.cpl_bad+'. 2. Expandir audiencias. 3. Testear Lead Ads vs Landing Page — en PR los Lead Ads suelen tener 30-40% mejor CPL.'});

  // 7. Good performance
  if(recs.length===0||(scores.cpl>=70&&scores.ctr>=70&&scores.freq>=70)) recs.push({type:'good',icon:'ti-award',title:'Performance sólido — Escalar lo que funciona',body:'Los indicadores principales están dentro del rango óptimo. Este es el momento de escalar presupuesto en los ad sets de mejor desempeño.',action:'Identificar los top 3 ad sets por CPL y aumentar presupuesto 20% cada semana. Evitar cambios a ad sets activos con buenos resultados.'});

  // Limit and sort: urgent first
  recs.sort(function(a,b){return(a.type==='urgent'?0:a.type==='warn'?1:2)-(b.type==='urgent'?0:b.type==='warn'?1:2);});
  return recs.slice(0,6);
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
var co={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#4b5563',font:{size:10}}},y:{grid:{color:'#e2e6ef'},ticks:{color:'#4b5563',font:{size:10}}}}};
function mk(id,type,data,opts){var el=document.getElementById(id);if(!el)return;try{charts[id]=new Chart(el,{type:type,data:data,options:opts||co});}catch(e){}}
function donut(id,labels,data,colors){mk(id,'doughnut',{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:0}]},{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{color:'#4b5563',boxWidth:10,font:{size:10}}}}});}

function initCharts(){
  var rng=getRng(),s=rng.summary||{},p=rng.platforms||{};
  var pk=Object.keys(p).filter(function(k){return p[k].spend>0.5;}).sort(function(a,b){return p[b].spend-p[a].spend;});

  if(state.tab==='overview'){
    var oM=JSON.parse(JSON.stringify(co));
    oM.plugins={legend:{display:true,labels:{color:'#4b5563',boxWidth:10,font:{size:10}}}};
    mk('chMain','bar',{labels:['Gasto','Leads×50','ThruPlays/1K'],datasets:[{data:[Math.round(s.spend),(s.leads||0)*50,Math.round((s.thruplay||0)/1000)],backgroundColor:[BRAND,'#22c55e','#818cf8'],borderRadius:5}]},oM);
    if(pk.length) donut('chPlat',pk.map(function(k){return PL[k]||k;}),pk.map(function(k){return Math.round(p[k].spend);}),pk.map(function(k){return PC[k]||'#4b5563';}));

    // CTR vs CPC chart
    var oCC=JSON.parse(JSON.stringify(co));
    oCC.plugins={legend:{display:true,labels:{color:'#4b5563',boxWidth:10,font:{size:10}}}};
    oCC.scales.y={grid:{color:'#e2e6ef'},ticks:{color:'#4b5563',font:{size:10},callback:function(v){return v+'%';}}};
    oCC.scales.y2={grid:{display:false},ticks:{color:'#4b5563',font:{size:10},callback:function(v){return '$'+v;}},position:'right'};
    mk('chCTRCPC','bar',{
      labels:pk.map(function(k){return PL[k]||k;}),
      datasets:[
        {label:'CTR %',data:pk.map(function(k){return parseFloat((p[k].ctr||0).toFixed(2));}),backgroundColor:pk.map(function(k){return PC[k]||'#4b5563';}),borderRadius:4,yAxisID:'y'},
        {label:'CPC $',data:pk.map(function(k){return parseFloat((p[k].cpc||0).toFixed(2));}),backgroundColor:pk.map(function(k){return (PC[k]||'#4b5563')+'66';}),borderRadius:4,yAxisID:'y2'}
      ]},oCC);

    // CPL by platform
    var oCPL=JSON.parse(JSON.stringify(co));
    oCPL.scales.y.ticks.callback=function(v){return '$'+v;};
    mk('chCPLplat','bar',{
      labels:pk.map(function(k){return PL[k]||k;}),
      datasets:[{label:'CPL $',data:pk.map(function(k){var pv=p[k];return pv.leads>0?parseFloat((pv.spend/pv.leads).toFixed(2)):0;}),backgroundColor:pk.map(function(k){return PC[k]||'#4b5563';}),borderRadius:5}]
    },oCPL);
  }

  if(state.tab==='platforms'){
    var totS=pk.reduce(function(s,k){return s+p[k].spend;},0);
    var totL=pk.reduce(function(s,k){return s+(p[k].leads||0);},0);
    donut('chPD',pk.map(function(k){return PL[k]||k;}),pk.map(function(k){return Math.round(p[k].spend);}),pk.map(function(k){return PC[k]||'#4b5563';}));
    donut('chPDL',pk.map(function(k){return PL[k]||k;}),pk.map(function(k){return p[k].leads||0;}),pk.map(function(k){return PC[k]||'#4b5563';}));
    var oC=JSON.parse(JSON.stringify(co));oC.scales.y.ticks.callback=function(v){return '$'+v;};
    mk('chCPL','bar',{labels:pk.map(function(k){return PL[k]||k;}),datasets:[{data:pk.map(function(k){var pv=p[k];return pv.leads>0?parseFloat((pv.spend/pv.leads).toFixed(2)):0;}),backgroundColor:pk.map(function(k){return PC[k]||'#4b5563';}),borderRadius:5}]},oC);
    var oCT=JSON.parse(JSON.stringify(co));oCT.scales.y.ticks.callback=function(v){return v+'%';};
    mk('chCTR','bar',{labels:pk.map(function(k){return PL[k]||k;}),datasets:[{data:pk.map(function(k){return parseFloat((p[k].ctr||0).toFixed(2));}),backgroundColor:pk.map(function(k){return PC[k]||'#4b5563';}),borderRadius:5}]},oCT);
  }

  if(state.tab==='paid'){
    var ads=rng.ads||[];
    if(state.ptab==='leads'){
      var top=ads.slice().sort(function(a,b){return b.leads-a.leads;}).filter(function(a){return a.leads>0;}).slice(0,5);
      if(!top.length)top=ads.slice(0,5);
      var oP=JSON.parse(JSON.stringify(co));oP.plugins={legend:{display:true,labels:{color:'#4b5563',boxWidth:10,font:{size:10}}}};
      mk('chPaid','bar',{labels:top.map(function(a){return a.name.replace(/^AC[A-Z_]*_/,'').substring(0,13);}),datasets:[{label:'Leads',data:top.map(function(a){return a.leads;}),backgroundColor:BRAND+'aa',borderRadius:3},{label:'CPL $',data:top.map(function(a){return a.leads>0?parseFloat((a.spend/a.leads).toFixed(2)):0;}),backgroundColor:BRAND,borderRadius:3}]},oP);
    } else if(state.ptab==='views'){
      var top2=ads.slice().sort(function(a,b){return b.thruplay-a.thruplay;}).filter(function(a){return a.thruplay>0;}).slice(0,5);
      if(!top2.length)top2=ads.slice(0,5);
      var oV=JSON.parse(JSON.stringify(co));oV.plugins={legend:{display:true,labels:{color:'#4b5563',boxWidth:10,font:{size:10}}}};
      mk('chPaid','bar',{labels:top2.map(function(a){return a.name.replace(/^AC[A-Z_]*_/,'').substring(0,13);}),datasets:[{label:'ThruPlays',data:top2.map(function(a){return a.thruplay;}),backgroundColor:BRAND,borderRadius:3},{label:'Views 25%',data:top2.map(function(a){return a.views25||0;}),backgroundColor:BRAND+'55',borderRadius:3}]},oV);
    }
  }

  if(state.tab==='funnel'){
    var ads2=rng.ads||[];
    var b={tof:{spend:0},mof:{spend:0},bof:{spend:0},unknown:{spend:0}};
    ads2.forEach(function(a){b[classifyAd(a.name)].spend+=a.spend;});
    var tS=b.tof.spend+b.mof.spend+b.bof.spend+b.unknown.spend;
    var tofP=pct(b.tof.spend,tS),mofP=pct(b.mof.spend,tS),bofP=pct(b.bof.spend,tS);
    var oF={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:'#4b5563',boxWidth:10,font:{size:10}}}},scales:{x:{stacked:false,grid:{display:false},ticks:{color:'#4b5563',font:{size:10}}},y:{grid:{color:'#e2e6ef'},ticks:{color:'#4b5563',font:{size:10},callback:function(v){return v+'%';}}}}};
    mk('chFunnel','bar',{
      labels:['Awareness (TOF)','Consideration (MOF)','Conversion (BOF)'],
      datasets:[
        {label:'Actual',data:[tofP,mofP,bofP],backgroundColor:'#60a5fa',borderRadius:4},
        {label:'Tu benchmark',data:[BM.client.tof,BM.client.mof,BM.client.bof],backgroundColor:BRAND+'88',borderRadius:4},
        {label:'Meta T3',data:[BM.meta.tof,BM.meta.mof,BM.meta.bof],backgroundColor:'#818cf844',borderRadius:4}
      ]},oF);
  }

  if(state.tab==='bb'){
    var s2=rng.summary||{};
    var cpl2=s2.leads>0?s2.spend/s2.leads:0;
    var fr2=s2.freq||0;
    var tpR=s2.thruplay>0&&s2.views25>0?Math.round(s2.thruplay/s2.views25*100):0;
    var sc2={
      cpl:cpl2>0?Math.max(0,Math.min(100,Math.round((1-Math.max(0,cpl2-BM.cpl_good)/(BM.cpl_bad-BM.cpl_good))*100))):50,
      ctr:Math.max(0,Math.min(100,Math.round((s2.ctr||0)/BM.ctr_good*100))),
      freq:Math.max(0,Math.min(100,Math.round((1-Math.max(0,fr2-BM.freq_good)/(BM.freq_bad-BM.freq_good))*100))),
      cpm:Math.max(0,Math.min(100,Math.round((1-Math.max(0,(s2.cpm||0)-BM.cpm_good)/(BM.cpm_warn*2-BM.cpm_good))*100))),
      thru:tpR>0?Math.max(0,Math.min(100,Math.round(tpR/BM.thruplay_rate_good*100))):50,
      reach:s2.reach>0?Math.max(0,Math.min(100,100-Math.round(fr2/BM.freq_bad*100))):50,
    };
    mk('chBB','radar',{
      labels:['CPL','CTR','Frecuencia','CPM','Completion Rate','Alcance'],
      datasets:[
        {label:'Score actual',data:[sc2.cpl,sc2.ctr,sc2.freq,sc2.cpm,sc2.thru,sc2.reach],backgroundColor:BRAND+'33',borderColor:BRAND,borderWidth:2,pointBackgroundColor:BRAND},
        {label:'Objetivo (100)',data:[100,100,100,100,100,100],backgroundColor:'transparent',borderColor:'#d0d5e2',borderWidth:1,borderDash:[4,4],pointRadius:0}
      ]
    },{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:'#4b5563',boxWidth:10,font:{size:10}}}},scales:{r:{grid:{color:'#e2e6ef'},ticks:{color:'#4b5563',font:{size:9},backdropColor:'rgba(248,249,252,0.9)',stepSize:25},pointLabels:{color:'#4b5563',font:{size:10}},suggestedMin:0,suggestedMax:100}}});
  }
}
